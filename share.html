<style>

a{color:inherit;}
button{font:inherit;color:inherit;cursor:pointer;}

.sub{color:var(--soft);font-size:13.5px;}

.st li.cur .lb{color:var(--ink);font-weight:700;}
.now{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--cbg,#F7F4F0);font-size:14px;}

.now .when{color:var(--soft);font-size:12.5px;}

.oc .m{display:block;color:var(--soft);font-weight:400;font-size:12.5px;margin-top:1px;}
.oc .go{color:#B3ADA6;font-size:18px;}
details.dn{margin-top:10px;}
details.dn summary{cursor:pointer;color:var(--soft);font-size:13.5px;padding:6px 2px;}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:600;margin-bottom:12px;}

.msg{text-align:center;padding:56px 18px;}
.msg .em{font-size:46px;line-height:1;margin-bottom:12px;}
.msg h2{margin:0 0 6px;font-size:20px;}
.msg p{margin:0;color:var(--soft);}
.btn{margin-top:16px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:9px 22px;font-weight:600;}
.warn{background:#FFF6E5;border:1px solid #F5DDA8;color:#7A5200;border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:12px;}
.foot{text-align:center;color:#9A97A4;font-size:12px;margin-top:18px;}
.sk{height:14px;border-radius:8px;background:linear-gradient(90deg,#EEE8E2,#F8F5F1,#EEE8E2);background-size:200% 100%;animation:sk 1.2s linear infinite;margin:10px 0;}
@keyframes sk{to{background-position:-200% 0;}}
@media (prefers-reduced-motion:reduce){.sk{animation:none;}}
@media (max-width:480px){.card{padding:16px 14px 18px;border-radius:16px;}.ttl{font-size:20px;}.kv{grid-template-columns:86px 1fr;}.st .dot{width:34px;height:34px;font-size:15px;}.st li.cur .dot{width:38px;height:38px;}.st li::before{top:16px;}.st .lb{font-size:10.5px;}}
</style>
</head>

  function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* รายละเอียดงานที่พิมพ์ด้วยตัวแก้ไขข้อความ (ขึ้นต้น <!--rt-->) เก็บเป็น HTML → กรองซ้ำที่นี่ก่อนแสดง: แท็กปลอดภัยเท่านั้น · ทิ้ง script/รูป/ฟอร์ม · เหลือแค่สีตัวอักษร/สีไฮไลต์ · ลิงก์ http(s) เปิดแท็บใหม่ noopener */
  var RT_PRE='<!--rt-->', RT_OK={DIV:1,P:1,BR:1,B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,DEL:1,SPAN:1,FONT:1,UL:1,OL:1,LI:1,A:1,SUB:1,SUP:1,BLOCKQUOTE:1},
    RT_DROP={SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,NOSCRIPT:1,TEMPLATE:1,TEXTAREA:1,SELECT:1,OPTION:1,SVG:1,MATH:1,LINK:1,META:1,HEAD:1,TITLE:1,IMG:1,AUDIO:1,VIDEO:1,CANVAS:1,FORM:1,INPUT:1,BUTTON:1,FRAME:1,FRAMESET:1,APPLET:1,BASE:1};

      if(n.nodeType===3){ dst.appendChild(document.createTextNode(n.nodeValue)); continue; }
      if(n.nodeType!==1) continue; var tg=n.nodeName.toUpperCase(); if(RT_DROP[tg]) continue; if(!RT_OK[tg]){ rtClean(n,dst); continue; }
      var el=document.createElement(tg.toLowerCase());
      if(tg==='A'){ var hr=String(n.getAttribute('href')||'').trim(); if(!/^https?:\/\//i.test(hr)){ rtClean(n,dst); continue; } el.setAttribute('href',hr); el.setAttribute('target','_blank'); el.setAttribute('rel','noopener noreferrer'); }
      if(tg==='SPAN'||tg==='FONT'){ var c=okColor(n.style&&n.style.color)||(tg==='FONT'?okColor(n.getAttribute('color')):''), b=okColor(n.style&&n.style.backgroundColor); if(c) el.style.color=c; if(b) el.style.backgroundColor=b; if(!c&&!b){ rtClean(n,dst); continue; } }

  /* ---------- ดึงข้อมูล (ฟังก์ชันฐานข้อมูลตัวเดียว · ทดสอบแทนที่ได้ด้วย window.__SHARE_RPC) ---------- */
  function rpc(tok,card,count){
    if(typeof window.__SHARE_RPC==='function') return Promise.resolve(window.__SHARE_RPC(tok,card,count));
    return fetch(CFG.url+'/rest/v1/rpc/branding_share_get',{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.key,Authorization:'Bearer '+CFG.key},cache:'no-store',referrerPolicy:'no-referrer',
      body:JSON.stringify({p_token:tok,p_card:card||null,p_count:!!count})}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }); }
  function readHash(){ var h=String(location.hash||'').replace(/^#/,''), tok='', card=''; h.split('&').forEach(function(p){ var kv=p.split('='); if(kv[0]==='t') tok=decodeURIComponent(kv[1]||''); else if(kv[0]==='c') card=decodeURIComponent(kv[1]||''); else if(!kv[1]&&/^[0-9a-f]{20,}$/i.test(kv[0])) tok=kv[0]; }); return {tok:tok,card:card}; }
  function go(card){ var h='#t='+encodeURIComponent(S.tok)+(card?'&c='+encodeURIComponent(card):''); if(location.hash===h) load(false); else location.hash=h; }

  var firstCount=true;
  function load(user){
    var seq=++S.seq, hh=readHash(), pv=S.view; S.tok=hh.tok; S.view=hh.card; if(hh.card!==pv&&S.tok){ S.cur=null; S.err=''; draw(); }
    if(!S.tok){ S.err='invalid'; draw(); return Promise.resolve(); }
    S.busy=true; if(user) draw();
    var count=firstCount;
    return rpc(S.tok,S.view||null,count).then(function(r){
      if(seq!==S.seq) return; firstCount=false; S.busy=false; S.last=Date.now(); S.stale=false;
      if(r===null||r===undefined){ S.err='invalid'; S.cur=null; S.main=null; }
      else if(r.closed){ S.err='closed'; S.cur=null; S.main=null; }
      else if(r.gone){ if(S.view){ S.err='gone-card'; S.cur=null; } else { S.err='gone'; S.cur=null; S.main=null; } }
      else if(r.ok){ S.err=''; S.opts=r.opts||{}; applyColOpts(S.opts); S.cur=r; if(r.is_main) S.main=r; }
      else { S.err='invalid'; }
      draw();
    }).catch(function(e){ if(seq!==S.seq) return; S.busy=false; if(S.cur||S.main){ S.stale=true; } else { S.err='net'; } draw(); });
  }
  function refreshQuiet(){ if(document.hidden||S.err==='invalid'||S.err==='closed'||S.err==='gone') return; load(false); }

  /* ---------- วาด ---------- */
  function msg(em,h,p,btn){ return '<div class="card msg"><div class="em">'+em+'</div><h2 class="hd">'+h+'</h2><p>'+p+'</p>'+(btn||'')+'</div>'; }
  function topBar(){ return '<div class="top"><b>📋 สถานะงาน</b><span class="rt">'+(S.last?'<span>อัปเดต '+pad(new Date(S.last).getHours())+':'+pad(new Date(S.last).getMinutes())+'</span>':'')+'<button type="button" class="rf" data-a="refresh"'+(S.busy?' disabled':'')+' aria-label="รีเฟรชข้อมูล">🔄 รีเฟรช</button></span></div>'; }
  function chipsHtml(c){ var out=''; var b=brandOf(c.brand), k=kindOf(c.kind), p=prioOf(c.priority);
    if(b) out+='<span class="chip" style="background:'+tint(b[1],.14)+';color:'+b[1]+';border-color:'+tint(b[1],.35)+'">'+esc(b[0])+'</span>';
    if(k) out+='<span class="chip" style="background:'+tint(k[1],.12)+';color:'+k[1]+';border-color:'+tint(k[1],.3)+'">'+esc(k[0])+'</span>';
    if(p) out+='<span class="chip" style="background:'+tint(p[1],.12)+';color:'+p[1]+';border-color:'+tint(p[1],.3)+'">'+esc(p[0])+'</span>';
    return out?'<div class="chips">'+out+'</div>':''; }
  function stepper(c){ var L=colsFor(c.kind), ix=stepIx(c,L), cc=L[ix];
    return '<ol class="st" aria-label="ขั้นตอนของงาน" style="grid-template-columns:repeat('+L.length+',1fr)">'+L.map(function(x,i){ var cls=i<ix?'past':(i===ix?'cur':'fut');
      return '<li class="'+cls+'" style="--c:'+x.c+';--c2:'+tint(x.c,.22)+'"'+(i===ix?' aria-current="step"':'')+'><div class="dot">'+(i<ix?'✓':x.e)+'</div><div class="lb">'+esc(x.t)+'</div></li>'; }).join('')+'</ol>'
      +'<div class="now" style="--cbg:'+tint(cc.c,.14)+'"><span style="font-size:20px">'+cc.e+'</span><span>'+(cc.done?'<b>เสร็จเรียบร้อยแล้ว</b>':'ตอนนี้อยู่ขั้นตอน <b>'+esc(cc.t)+'</b>')+'</span>'
      +((c.col_at||c.done_at)?'<span class="when">'+(cc.done?'เมื่อ ':'เข้าขั้นนี้เมื่อ ')+esc(fmtDay(cc.done&&c.done_at?c.done_at:c.col_at))+' · '+esc(ago(cc.done&&c.done_at?c.done_at:c.col_at))+'</span>':'')+'</div>'; }
  function people(list){ return '<div class="ppl">'+list.map(function(n){ return '<span class="pp"><i style="background:'+hue(n)+'">'+esc(initial(n))+'</i>'+esc(n)+'</span>'; }).join('')+'</div>'; }
  function dueHtml(c){ if(!c.due&&!c.start) return ''; var s=c.start?esc(fmtDay(c.start)):'', e=c.due?esc(fmtDay(c.due)):'', cls='', extra='';
    if(c.due&&!colOf(c.col).done){ var d=dayOf(c.due), t=new Date(); t=new Date(t.getFullYear(),t.getMonth(),t.getDate()); if(d){ var n=dayDiff(t,d); if(n<0){ cls=' late'; extra=' (เลยกำหนด '+(-n)+' วัน)'; } else if(n<=3){ cls=' soon'; extra=n===0?' (ครบกำหนดวันนี้)':' (อีก '+n+' วัน)'; } } }

  function isImg(u){ return /\.(png|jpe?g|gif|webp|avif|bmp)(\?|#|$)/i.test(u)||/^https?:\/\/(lh\d\.googleusercontent\.com|drive\.usercontent\.google\.com)\//i.test(u); }
  function driveId(u){ var m=/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=)([\w-]{10,})/i.exec(u); return m?m[1]:''; }
  function linksHtml(c){ var L=(c.links||[]).map(function(x){ return {t:String(x.t||'').trim(),u:safeUrl(x.u)}; }).filter(function(x){ return x.u; }); if(!L.length) return '';
    var th=[], ln=[]; L.forEach(function(x){ var did=driveId(x.u); if(isImg(x.u)) th.push({t:x.t,u:x.u,src:x.u}); else if(did) th.push({t:x.t,u:x.u,src:'https://drive.google.com/thumbnail?id='+did+'&sz=w800',drive:1}); else ln.push(x); });

    if(ln.length) out+='<div class="lk">'+ln.map(function(x){ return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener noreferrer">🔗 <span>'+esc(x.t||x.u)+'</span></a>'; }).join('')+'</div>';
    return out; }
  function timeline(c){ var mv=(c.moves||[]).filter(function(m){ return m&&m.to; }); if(!mv.length) return '';
    return '<div class="sec">🕒 ความคืบหน้า</div><ul class="tl">'+mv.slice().reverse().slice(0,8).map(function(m){ var x=colOf(m.to); return '<li style="--c:'+x.c+'"><b>'+esc(x.e+' '+x.t)+'</b><small>'+esc(fmtTs(m.at))+'</small></li>'; }).join('')+'</ul>'; }
  function cardHtml(c){
    var prod=c.product?esc(c.product)+(c.sku?' <span class="sub">· '+esc(c.sku)+'</span>':''):'';
    var kv='';
    if(prod) kv+='<dt>สินค้า</dt><dd>'+prod+'</dd>';

    if(+c.check_total>0){ var pc=Math.round(100*(+c.check_done)/(+c.check_total)); kv+='<dt>ขั้นตอนย่อย</dt><dd>'+(+c.check_done)+' / '+(+c.check_total)+' เสร็จแล้ว<div class="bar" role="progressbar" aria-valuenow="'+pc+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pc+'%"></i></div></dd>'; }
    return '<div class="card">'+chipsHtml(c)+'<h1 class="ttl">'+esc(c.title||'(ไม่มีชื่อ)')+'</h1>'+stepper(c)+(kv?'<div class="sec">ข้อมูลงาน</div><dl class="kv">'+kv+'</dl>':'')
      +(function(){ var nb=noteBlock(c.note); return nb?'<div class="sec">📝 รายละเอียดงาน</div>'+nb:''; })()+linksHtml(c)+timeline(c)+'</div>'; }
  function others(){ var m=S.main; if(!m||!(m.others||[]).length) return '';
    var names=m.others.map(function(o,i){ return o.name||('รายการที่ '+(i+1)); }); if(names.indexOf(S.tab)<0) S.tab=names[0]; var o=m.others[names.indexOf(S.tab)], nm=o.name||'';
    var counts=o.counts||{}, tot=0, open=0; COLS.forEach(function(x){ var n=+counts[x.k]||0; tot+=n; if(!x.done) open+=n; });

    var tabs=names.length>1?'<div class="tabs" role="tablist" aria-label="เลือกชื่อ">'+names.map(function(n){ return '<button type="button" class="tab'+(n===S.tab?' on':'')+'" role="tab" aria-selected="'+(n===S.tab?'true':'false')+'" data-a="tab" data-n="'+esc(n)+'">'+esc(n)+'</button>'; }).join('')+'</div>':'';
    if(!tot) return '<div class="card">'+head+tabs+'<div class="empty">'+(names.length>1&&nm?esc(nm)+' ':'')+'ไม่มีงานอื่นแล้วตอนนี้ 🎉</div></div>';

      +(dn.length?'<details class="dn"><summary>✅ งานที่เสร็จแล้ว ('+dn.length+')</summary><ul class="oc" style="margin-top:8px">'+dn.map(item).join('')+'</ul></details>':'')+'</div>'; }

  function draw(){
    var h=topBar(); var e=S.err;
    if(e==='invalid') h=msg('🔗','ลิงก์ไม่ถูกต้อง','ลองตรวจว่าคัดลอกลิงก์มาครบ หรือขอลิงก์ใหม่จากผู้ส่ง');
    else if(e==='closed') h=msg('🔒','ลิงก์นี้ปิดแล้ว','เจ้าของการ์ดปิดการแชร์ไว้ — กรุณาขอลิงก์ใหม่จากผู้ส่ง');
    else if(e==='gone') h=msg('🗑️','ไม่พบการ์ดนี้แล้ว','การ์ดอาจถูกลบหรือย้ายออก — ติดต่อผู้ส่งลิงก์');
    else if(e==='net') h=topBar()+msg('📡','เชื่อมต่อไม่ได้','ตรวจอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง','<button type="button" class="btn" data-a="refresh">ลองใหม่</button>');
    else if(e==='gone-card') h=topBar()+'<button type="button" class="back" data-a="back">← กลับ</button>'+msg('🗂️','ไม่พบงานนี้','งานนี้ถูกลบหรือไม่ได้อยู่ในรายการที่เปิดให้ดูแล้ว');
    else if(!S.cur) h=topBar()+'<div class="card"><div class="sk" style="width:40%"></div><div class="sk" style="height:26px;width:80%"></div><div class="sk"></div><div class="sk" style="width:70%"></div></div>';
    else { var c=S.cur.card, isMain=S.cur.is_main;
      h+=(S.stale?'<div class="warn">⚠️ เชื่อมต่อไม่ได้ชั่วคราว — กำลังแสดงข้อมูลล่าสุดที่ได้ ('+esc(fmtTs(S.last))+')</div>':'')
        +(!isMain?'<button type="button" class="back" data-a="back">← กลับไป “'+esc(((S.main&&S.main.card)||{}).title||'การ์ดหลัก')+'”</button>':'')
        +cardHtml(c)+(isMain?others():'')
        +'<div class="foot">ดูได้อย่างเดียว · ข้อมูลอัปเดตอัตโนมัติ · ขอบคุณที่ติดตามงานกับเรา 💛</div>'; }
    var y=window.scrollY; $app.innerHTML=h; try{ document.title=(S.cur&&S.cur.card&&S.cur.card.title?S.cur.card.title+' · ':'')+'สถานะงาน'; }catch(x){}
    window.scrollTo(0,y);
  }
  /* รูปที่โหลดไม่ได้ (เช่น ไฟล์ Drive ที่ยังไม่เปิดสิทธิ์) → เปลี่ยนเป็นปุ่มลิงก์ธรรมดา */
  document.addEventListener('error',function(e){ var t=e.target; if(t&&t.tagName==='IMG'&&t.parentNode&&t.parentNode.hasAttribute&&t.parentNode.hasAttribute('data-th')){ var a=t.parentNode; a.className='lnk'; a.removeAttribute('data-th'); a.style.cssText='display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px 12px;text-decoration:none;font-size:14px;background:#fff;word-break:break-all;'; var cap=(a.querySelector('span')||{}).textContent||'เปิดไฟล์'; a.innerHTML='🔗 <span>'+esc(cap)+'</span>'; } },true);
  $app.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('[data-a]'); if(!b) return; var a=b.getAttribute('data-a');
    if(a==='refresh'){ load(true); }
    else if(a==='tab'){ S.tab=b.getAttribute('data-n'); draw(); }
    else if(a==='open'){ go(b.getAttribute('data-id')); window.scrollTo(0,0); }
    else if(a==='back'){ go(''); } });
  window.addEventListener('hashchange',function(){ load(false); });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden&&S.cur) load(false); });
  S.timer=setInterval(refreshQuiet,POLL);
  window.__SHARE={noteBlock:noteBlock,S:S,load:load,draw:draw,readHash:readHash,COLS:COLS,refreshQuiet:refreshQuiet,isImg:isImg,driveId:driveId};
  load(true);
})();
</script>
</body>
